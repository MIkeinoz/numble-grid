<title>Numble Grid V2.1</title>
<style>
:root{
  --ink:#1A1A1A; --ink-edge:#000000; --lime:#8DC63F; --lime-edge:#67982C;
  --red:#C8322B; --amber:#E0A400; --paper:#EDEDE7; --card:#F8F8F5; --tile:#FFFFFF;
  --tile-edge:#D3D3CB; --ghost:#B6B6AE; --muted:#75756E; --line:#DEDED6;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;
  display:flex; justify-content:center; align-items:flex-start;
  padding:calc(20px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right))
          calc(20px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
  min-height:100vh; min-height:100dvh; overscroll-behavior:none;
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  user-select:none; -webkit-user-select:none;
}
button{font-family:inherit;border:0;padding:0;background:none;color:inherit;cursor:pointer;}
.card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;}
.hdr{background:var(--ink);padding:16px 16px 12px;text-align:center;}
.hdr h1{margin:0;font-size:20px;font-weight:900;letter-spacing:.14em;color:#fff;}
.hdr .sub{font-size:12px;letter-spacing:.14em;color:var(--lime);}
.rule{height:4px;background:var(--lime);}
.pad{padding:12px 12px 0;}
.hint{margin:8px 0 4px;font-size:14px;color:var(--muted);}
.warn{margin:0 0 4px;font-size:14px;color:var(--red);}
.good{margin:0 0 4px;font-size:14px;color:var(--lime-edge);font-weight:700;}

.wide{width:100%;border-radius:8px;padding:10px 8px;font-size:13px;font-weight:700;
  text-transform:uppercase;letter-spacing:.1em;transition:transform .075s;}
.wide:active{transform:translateY(2px);}
.wide.lime{background:var(--lime);color:#fff;box-shadow:0 3px 0 0 var(--lime-edge);}
.wide.ink{background:var(--ink);color:#fff;box-shadow:0 3px 0 0 var(--ink-edge);}
.wide.plain{background:#fff;color:var(--ink);box-shadow:0 2px 0 0 var(--tile-edge);}

.chip{width:100%;border-radius:6px;padding:8px 4px;font-size:12px;font-weight:700;
  text-transform:uppercase;letter-spacing:.04em;line-height:1.15;
  background:#fff;color:var(--muted);box-shadow:0 2px 0 0 var(--tile-edge);
  display:flex;align-items:center;justify-content:center;gap:5px;transition:transform .075s;}
.chip:active{transform:translateY(2px);}
.chip.on{background:var(--ink);color:#fff;box-shadow:0 2px 0 0 var(--ink-edge);}
.chiprow{display:grid;gap:4px;margin-top:4px;}
.dot{width:8px;height:8px;border-radius:999px;flex:0 0 auto;}

.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:0 12px 4px;}
.tile{position:relative;aspect-ratio:1/1;border-radius:8px;
  background:var(--tile);color:var(--ink);box-shadow:0 3px 0 0 var(--tile-edge);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;transition:transform .075s;}
.tile:active{transform:translateY(2px);}
.tile.green{background:var(--lime);color:#fff;box-shadow:0 3px 0 0 var(--lime-edge);}
.tile.sel{outline:3px solid var(--ink);outline-offset:2px;}
.tile.partner{outline:3px solid var(--lime);outline-offset:2px;}
.tile.cycle{outline:3px solid var(--amber);outline-offset:2px;}
.tile.cycle.sel{outline-color:var(--ink);}
.cyclebadge{position:absolute;left:3px;bottom:2px;min-width:16px;height:16px;padding:0 4px;
  border-radius:999px;background:var(--amber);color:#fff;font-size:10px;font-weight:900;
  line-height:16px;text-align:center;}
.cyclepanel{margin:8px 12px 12px;padding:11px 12px;border-radius:8px;background:#FFF8E3;
  color:var(--ink);box-shadow:inset 0 0 0 2px var(--amber);font-size:13px;line-height:1.35;}
.cyclepanel strong{display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.08em;font-size:11px;}
.tile.locked{opacity:.92;}
.lines{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px 12px;}
.tile.amber{box-shadow:0 3px 0 0 var(--tile-edge), inset 0 0 0 3px var(--amber);}
.tile.green.amber{box-shadow:0 3px 0 0 var(--lime-edge), inset 0 0 0 3px var(--amber);}
.wide.amber{background:var(--amber);color:#fff;box-shadow:0 3px 0 0 #A87A00;}
.wide.off{background:#fff;color:#B6B6AE;box-shadow:0 2px 0 0 var(--tile-edge);}
.tile.sel.selred{outline-color:var(--red);}
.tile .big.asred{color:var(--red);}
.corner{position:absolute;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;}
.corner.tr{top:2px;right:3px;font-size:11px;color:var(--red);}
.corner.tl{top:1px;left:4px;font-size:12px;color:var(--ghost);}
.clue{position:relative;aspect-ratio:1/1;background:transparent;padding:0;}
.clue svg{display:block;width:100%;height:100%;}

.status{padding:12px;text-align:center;font-size:12px;font-weight:700;
  text-transform:uppercase;letter-spacing:.12em;color:var(--muted);}
.banner{margin:0 12px 12px;border-radius:8px;padding:12px;text-align:center;
  font-size:14px;font-weight:900;text-transform:uppercase;letter-spacing:.12em;
  background:var(--lime);color:#fff;box-shadow:0 3px 0 0 var(--lime-edge);}

.ptrlabel{padding:0 12px 4px;font-size:12px;font-weight:700;
  text-transform:uppercase;letter-spacing:.12em;color:var(--muted);}
.ptrrow{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:0 12px 8px;}
.ptr{border-radius:8px;padding:8px;font-size:14px;font-weight:900;
  background:var(--tile);color:var(--muted);box-shadow:0 3px 0 0 var(--tile-edge);transition:transform .075s;}
.ptr:active{transform:translateY(2px);}
.ptr.on{background:var(--lime);color:#fff;box-shadow:0 3px 0 0 var(--lime-edge);}

.keypad{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:0 12px 12px;}
.key{aspect-ratio:1/1;border-radius:8px;background:var(--tile);color:var(--ink);
  box-shadow:0 3px 0 0 var(--tile-edge);font-size:20px;font-weight:900;
  font-variant-numeric:tabular-nums;transition:transform .075s;}
.key:active{transform:translateY(2px);}
.key.redtext{color:var(--red);}
.key.ink{background:var(--ink);color:#fff;box-shadow:0 3px 0 0 var(--ink-edge);font-size:18px;}
.nextwrap{padding:0 12px 12px;}

.footer{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px;border-top:1px solid var(--line);}
.sbtn{border-radius:6px;padding:8px 2px;font-size:12px;font-weight:700;
  text-transform:uppercase;letter-spacing:.04em;background:#fff;color:var(--ink);
  box-shadow:0 2px 0 0 var(--tile-edge);transition:transform .075s;}
.sbtn:active{transform:translateY(2px);}
.sbtn.armed{background:var(--ink);color:#fff;box-shadow:0 2px 0 0 var(--ink-edge);}

.togglewrap{padding:0 12px 16px;}
.toggle{width:100%;display:flex;align-items:center;justify-content:space-between;
  border-radius:6px;padding:8px 12px;background:#fff;box-shadow:0 2px 0 0 var(--tile-edge);
  text-align:left;transition:transform .075s;}
.toggle:active{transform:translateY(2px);}
.toggle .lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink);}
.toggle .pill{border-radius:6px;padding:4px 8px;font-size:12px;font-weight:700;
  text-transform:uppercase;background:var(--paper);color:var(--muted);}
.toggle .pill.on{background:var(--lime);color:#fff;}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="shotfile" accept="image/*" style="display:none">
<script>
/* Numble screenshot reader - pure pixel analysis, no dependencies.
   analyse(rgba, width, height) -> {ok, kinds, digits, dirs, flags} | {ok:false, error} */
var NumbleScan = (function () {
  "use strict";
  var GW = 14, GH = 18, NB = GW * GH;

  var BANK = null;
  function loadBank(str) {
    BANK = str.split(",").map(function (s) {
      var bits = new Uint8Array(NB);
      for (var i = 0; i < NB; i++) {
        var nib = parseInt(s.charAt(2 + (i >> 2)), 16);
        bits[i] = (nib >> (3 - (i & 3))) & 1;
      }
      return { d: s.charAt(0), k: s.charAt(1), bits: bits };
    });
  }

  function isTile(r, g, b) { return Math.abs(r-239)<=9 && Math.abs(g-240)<=9 && Math.abs(b-242)<=9; }
  function isGreen(r, g, b) { return Math.abs(r-127)<=34 && Math.abs(g-174)<=34 && Math.abs(b-102)<=34; }
  function isDark(r, g, b) { return Math.abs(r-70)<=34 && Math.abs(g-72)<=34 && Math.abs(b-71)<=34; }

  function bands(prof, thresh, gap, minlen) {
    var idx = [], i;
    for (i = 0; i < prof.length; i++) if (prof[i] >= thresh) idx.push(i);
    if (!idx.length) return [];
    var runs = [], s = idx[0], prev = idx[0];
    for (i = 1; i < idx.length; i++) {
      if (idx[i] - prev > gap) { runs.push([s, prev]); s = idx[i]; }
      prev = idx[i];
    }
    runs.push([s, prev]);
    return runs.filter(function (r) { return r[1] - r[0] >= minlen; });
  }

  function pickSeven(bs) {
    if (bs.length < 7) return null;
    if (bs.length === 7) return bs;
    var best = null;
    for (var i = 0; i + 7 <= bs.length; i++) {
      var g = bs.slice(i, i + 7);
      var cs = g.map(function (b) { return (b[0] + b[1]) / 2; });
      var dmin = Infinity, dmax = -Infinity;
      for (var j = 0; j < 6; j++) {
        var dd = cs[j + 1] - cs[j];
        if (dd < dmin) dmin = dd;
        if (dd > dmax) dmax = dd;

  var n = 0, i;
  for (i = 0; i < N; i++)
    if (!isClue(i) && !S.green[i] && !S.reds[i] && !S.yellow[i]) n++;
  return n;
}

/* Squares that would BOTH go green if swapped with square i: not yet green,
   holding the digit i needs, and needing the digit i holds. */
function partners(i) {
  var out = [], t = targets(), b = board(), j;
  if (i === null || isClue(i)) return out;
  var myVal = b[i], myTgt = t[i];
  if (!myTgt || myVal === myTgt) return out;
  for (j = 0; j < N; j++) {
    if (j === i || isClue(j)) continue;
    if (t[j] && b[j] === t[j]) continue;
    if (b[j] === myTgt && t[j] === myVal) out.push(j);
  }
  return out;
}

function hasAnyReciprocal() {
  var t = targets(), b = board(), i, j;
  for (i = 0; i < N; i++) {
    if (isClue(i) || !t[i] || b[i] === t[i]) continue;
    for (j = i + 1; j < N; j++) {
      if (isClue(j) || !t[j] || b[j] === t[j]) continue;
      if (b[j] === t[i] && t[j] === b[i]) return true;
    }
  }
  return false;
}

function findCycle(start) {
  var t = targets(), b = board();
  if (start === null || isClue(start) || !t[start] || b[start] === t[start]) return [];
  var unsolved = [], i;
  for (i = 0; i < N; i++)
    if (!isClue(i) && t[i] && b[i] !== t[i]) unsolved.push(i);

  function dfs(cur, path, used) {
    var need = t[cur], k, nxt, out;
    for (k = 0; k < unsolved.length; k++) {
      nxt = unsolved[k];
      if (b[nxt] !== need) continue;
      if (nxt === start) return path.length >= 2 ? path.slice() : [];
      if (used[nxt]) continue;
      used[nxt] = true; path.push(nxt);
      out = dfs(nxt, path, used);
      if (out.length) return out;
      path.pop(); used[nxt] = false;
    }
    return [];
  }

  var used = {}; used[start] = true;
  var cycle = dfs(start, [start], used);
  return cycle.length >= 3 ? cycle : [];
}

function cycleLabel(cycle) {
  if (!cycle || !cycle.length) return "";
  var b = board(), t = targets(), parts = [], i;
  for (i = 0; i < cycle.length; i++) parts.push(b[cycle[i]] + " needs " + t[cycle[i]]);
  return parts.join(" → ");
}

function cycleDigits(cycle) {
  if (!cycle || !cycle.length) return "";
  var b = board(), out = [], i;
  for (i = 0; i < cycle.length; i++) out.push(b[cycle[i]]);
  out.push(b[cycle[0]]);
  return out.join(" → ");
}

function playStats() {
  var t = targets(), b = board(), i, tiles = 0, solved = 0, untargeted = 0;
  for (i = 0; i < N; i++) {
    if (isClue(i)) continue;
    tiles++;
    if (t[i] === "") untargeted++;
    else if (b[i] === t[i]) solved++;
  }
  return { tiles: tiles, solved: solved, untargeted: untargeted,
           complete: tiles > 0 && solved === tiles };
}

function subsetOf(step) {
  var out = [], i;
  if (step === "red") { for (i = 0; i < N; i++) if (!isClue(i) && !S.green[i]) out.push(i); }
  else if (step === "fix") { for (i = 0; i < N; i++) out.push(i); }
  return out;
}

/* ---------- actions ---------- */

function setStep(step) {
  S.step = step;
  S.pair = [];
  if (step === "play" || step === "free") { S.sel = null; return; }
  var list = subsetOf(step), pick = null, k;
  if (step === "red") {
    for (k = 0; k < list.length; k++)
      if (!S.reds[list[k]] && !S.yellow[list[k]]) { pick = list[k]; break; }
  }
  if (pick === null && S.sel !== null && list.indexOf(S.sel) !== -1) pick = S.sel;
  if (pick === null && list.length) pick = list[0];
  S.sel = pick;
}

function nextIn(from) {
  var list = subsetOf(S.step), k;
  for (k = 0; k < list.length; k++) if (list[k] > from) return list[k];
  return null;
}

function prevIn(from) {
  var list = subsetOf(S.step), k, out = null;
  for (k = 0; k < list.length; k++) { if (list[k] < from) out = list[k]; else break; }
  return out;
}

function pressDigit(d) {
  if (S.sel === null || inPlay()) return;
  var i = S.sel, n;
  if (inFix()) {
    var max = maxLen(i), cur = S.vals[i];
    S.vals[i] = cur.length >= max ? d : cur + d;
    S.playVals = null; S.swaps = 0; S.hist = [];
    if (!isClue(i) && S.vals[i].length >= max) { n = nextIn(i); if (n !== null) S.sel = n; }
  } else {
    S.reds[i] = d;
    S.yellow[i] = false;
    n = nextIn(i); if (n !== null) S.sel = n;
  }
  update();
}

function markAsIs() {
  if (S.sel === null || inPlay() || inFix()) return;
  var i = S.sel;
  if (S.yellow[i]) { S.yellow[i] = false; }
  else {
    S.yellow[i] = true; S.reds[i] = "";
    var n = nextIn(i); if (n !== null) S.sel = n;
  }
  update();
}

function backspace() {
  if (S.sel === null || inPlay()) return;
  var i = S.sel;
  if (inFix()) {
    S.playVals = null; S.swaps = 0; S.hist = [];
    if (S.vals[i] !== "") { S.vals[i] = S.vals[i].slice(0, -1); update(); return; }
    var p = prevIn(i);
    if (p !== null) { S.sel = p; S.vals[p] = ""; }
    update(); return;
  }
  if (S.reds[i] !== "" || S.yellow[i]) { S.reds[i] = ""; S.yellow[i] = false; update(); return; }
  var q = prevIn(i);
  if (q !== null) { S.sel = q; S.reds[q] = ""; S.yellow[q] = false; }
  update();
}

function advance() { var n = nextIn(S.sel === null ? -1 : S.sel); if (n !== null) { S.sel = n; update(); } }

function togglePointer(dir, axis) {
  if (S.sel === null || !isClue(S.sel)) return;
  var cur = S.dirs[S.sel];
  S.dirs[S.sel] = { h: cur.h, v: cur.v };
  S.dirs[S.sel][axis] = cur[axis] === dir ? "" : dir;
  update();
}

function toggleGreen() {
  if (S.sel === null || isClue(S.sel)) return;
  S.green[S.sel] = !S.green[S.sel];
  S.playVals = null; S.swaps = 0; S.hist = [];
  if (S.green[S.sel]) { S.reds[S.sel] = ""; S.yellow[S.sel] = false; }
  update();
}

function enterPlay() {
  if (pending() > 0) return;
  if (S.playVals === null) S.playVals = S.vals.slice();
  setStep("play");
  update();
}

function restartPlay() { S.playVals = S.vals.slice(); S.pair = []; S.swaps = 0; S.hist = []; update(); }

function tapPlayCell(i) {
  if (isClue(i)) return;
  if (!S.hist) S.hist = [];
  if (S.pair.length === 1 && S.pair[0] !== i) S.hist.push([S.pair[0], i]);
  if (S.pair.length === 0) { S.pair = [i]; update(); return; }
  if (S.pair[0] === i) { S.pair = []; update(); return; }
  var a = S.pair[0], nv = board().slice(), tmp = nv[a];
  nv[a] = nv[i]; nv[i] = tmp;
  S.playVals = nv;
  S.swaps++;
  S.pair = [];
  update();
}

function tapCell(i) {
  if (inFree()) { tapFreeCell(i); return; }
  if (inPlay()) { tapPlayCell(i); return; }
  if (inFix()) { S.sel = i; update(); return; }
  if (isClue(i) || S.green[i]) return;
  S.sel = i;
  update();
}

function clearRed() { S.reds = filled(""); S.yellow = filled(false); update(); }

function reloadPuzzle() { forget(); S = freshState(); update(); }

function clearAll() {
  forget();
  S = freshState();
  S.green = filled(false); S.vals = filled(""); S.dirs = emptyDirs();
  setStep("fix");
  update();
}


/* ---------- the actual Numble rule ----------
   Each of the four odd rows and four odd columns must hold 1-7 exactly once.
   (Each clue bubble is the sum of the two tiles its arrows point at, which is
   what makes the solution unique - but the win condition is the 1-7 rule.) */

var LINES = (function () {
  var L = [], r, c, cells;
  for (r = 0; r < SIZE; r += 2) {
    cells = []; for (c = 0; c < SIZE; c++) cells.push(r * SIZE + c);
    L.push({ kind: "row", n: r / 2 + 1, cells: cells });
  }
  for (c = 0; c < SIZE; c += 2) {
    cells = []; for (r = 0; r < SIZE; r++) cells.push(r * SIZE + c);
    L.push({ kind: "col", n: c / 2 + 1, cells: cells });
  }
  return L;
})();

function lineDone(line, b) {
  var seen = {}, k, v;
  for (k = 0; k < line.cells.length; k++) {
    v = b[line.cells[k]];
    if (!v || v < "1" || v > "7" || seen[v]) return false;
    seen[v] = 1;
  }
  return true;
}

function lineState() {
  var b = board(), out = { done: 0, flags: [] }, i;
  for (i = 0; i < LINES.length; i++) {
    var ok = lineDone(LINES[i], b);
    out.flags.push(ok);
    if (ok) out.done++;
  }
  return out;
}

/* a tile is settled once every line it belongs to holds 1-7 */
function settled(i, ls) {
  if (isClue(i)) return false;
  var any = false, k;
  for (k = 0; k < LINES.length; k++) {
    if (LINES[k].cells.indexOf(i) === -1) continue;
    any = true;
    if (!ls.flags[k]) return false;
  }
  return any;
}

function inFree() { return S.step === "free"; }

function enterFree() {
  if (S.playVals === null) S.playVals = S.vals.slice();
  S.pair = []; S.sel = null; S.hist = [];
  S.step = "free";
  update();
}

function undoSwap() {
  if (!S.hist || !S.hist.length) return;
  var m = S.hist.pop(), nv = board().slice(), t = nv[m[0]];
  nv[m[0]] = nv[m[1]]; nv[m[1]] = t;
  S.playVals = nv;
  if (S.swaps > 0) S.swaps--;
  S.pair = [];
  update();
}

function tapFreeCell(i) {
  if (isClue(i) || S.green[i]) return;      // scanned greens are already right
  if (S.pair.length === 0) { S.pair = [i]; update(); return; }
  if (S.pair[0] === i) { S.pair = []; update(); return; }
  var a = S.pair[0], nv = board().slice(), t = nv[a];
  nv[a] = nv[i]; nv[i] = t;
  S.playVals = nv;
  if (!S.hist) S.hist = [];
  S.hist.push([a, i]);
  S.swaps++;
  S.pair = [];
  update();
}

/* ---------- screenshot import ---------- */

function applyScan(R) {
  var i, r, c;
  S.green = filled(false); S.vals = filled(""); S.dirs = emptyDirs();
  S.reds = filled(""); S.yellow = filled(false);
  S.playVals = null; S.pair = []; S.swaps = 0; S.scanned = true;
  for (r = 0; r < 7; r++) for (c = 0; c < 7; c++) {
    i = r * SIZE + c;
    S.vals[i] = R.digits[r][c];
    S.green[i] = R.kinds[r][c] === "G";
    if (R.kinds[r][c] === "D") S.dirs[i] = { h: R.dirs[r][c].h, v: R.dirs[r][c].v };
  }
  setStep("red");
  var tiles = 0, clues = 0;
  for (i = 0; i < N; i++) { if (isClue(i)) clues++; else if (S.vals[i]) tiles++; }
  var msg = "Read " + tiles + " tiles and " + clues + " clues.";
  if (R.flags.length) {
    msg += " Check " + R.flags.map(function (f) { return "r" + (f[0]+1) + "c" + (f[1]+1); })
      .join(", ") + " - not confident.";
  } else {
    msg += " Now type the red targets.";
  }
  S.msg = { text: msg, bad: R.flags.length > 0 };
  update();
}

function readShot(file) {
  if (!file) return;
  S.msg = { text: "Reading screenshot\u2026", bad: false }; render();
  var fr = new FileReader();
  fr.onerror = function () { S.msg = { text: "Could not read that file.", bad: true }; render(); };
  fr.onload = function () {
    var img = new Image();
    img.onerror = function () { S.msg = { text: "That file is not an image.", bad: true }; render(); };
    img.onload = function () {
      try {
        var scale = Math.min(1, 2000 / img.width);
        var cw2 = Math.round(img.width * scale), chh = Math.round(img.height * scale);
        var cv = document.createElement("canvas");
        cv.width = cw2; cv.height = chh;
        var ctx = cv.getContext("2d", { willReadFrequently: true });
        ctx.drawImage(img, 0, 0, cw2, chh);
        var R = NumbleScan.analyse(ctx.getImageData(0, 0, cw2, chh).data, cw2, chh);
        if (!R.ok) {
          S.msg = { text: R.error + " - crop to the puzzle grid and try again.", bad: true };
          render(); return;
        }
        applyScan(R);
      } catch (e) {
        S.msg = { text: "Could not analyse that image (" + e.message + ").", bad: true };
        render();
      }
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

/* ---------- rendering ---------- */

function clueSVG(i, isSel) {
  var d = S.dirs[i] || { h: "", v: "" }, v = S.vals[i] || "";
  var s = '<svg viewBox="0 0 100 100" aria-hidden="true">';
  if (d.h && TAIL[d.h]) s += '<polygon points="' + TAIL[d.h] + '" fill="#1A1A1A"/>';
  if (d.v && TAIL[d.v]) s += '<polygon points="' + TAIL[d.v] + '" fill="#1A1A1A"/>';
  s += '<circle cx="50" cy="50" r="32" fill="#1A1A1A"/>';
  if (isSel) s += '<circle cx="50" cy="50" r="35" fill="none" stroke="#8DC63F" stroke-width="5"/>';
  if (v) s += '<text x="50" y="50" dy="0.35em" text-anchor="middle" fill="#FFFFFF" ' +
    'font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="' +
    (v.length > 1 ? 40 : 46) + '">' + v + '</text>';
  return s + '</svg>';
}

function cellHTML(i, t, b, mates, cycle) {
  var r = Math.floor(i / SIZE) + 1, c = (i % SIZE) + 1;
  var pos = 'Row ' + r + ' column ' + c + ', ';

  if (isClue(i)) {
    var d = S.dirs[i] || { h: "", v: "" };
    var pt = [d.h, d.v].filter(Boolean).join(" and ");
    return '<button class="clue" data-act="cell" data-i="' + i + '" aria-label="' + pos +
      'clue ' + (S.vals[i] || "empty") + (pt ? ", pointing " + pt : "") + '">' +
      clueSVG(i, S.sel === i && inFix()) + '</button>';
  }

  if (inFree()) {
    var fd = b[i] || "", lock = S.green[i], ok = lock || settled(i, mates.ls);
    var pk = S.pair.indexOf(i) !== -1;
    return '<button class="tile' + (ok ? " green" : "") + (lock ? " locked" : "") +
      (pk ? " sel" : "") + '" data-act="cell" data-i="' + i + '" aria-label="' + pos +
      (ok ? "green" : "white") + ', ' + (fd || "empty") + (lock ? ", locked" : "") + '">' +
      '<span class="big">' + fd + '</span></button>';
  }

  if (inPlay()) {
    var want = t[i], digit = b[i] || "";
    var done = want !== "" && digit === want;
    var picked = S.pair.indexOf(i) !== -1;
    var mate = mates.indexOf(i) !== -1;
    var cycleAt = cycle ? cycle.indexOf(i) : -1;
    return '<button class="tile' + (done ? " green" : "") + (S.yellow[i] ? " amber" : "") +
      (cycleAt !== -1 ? " cycle" : "") + (picked ? " sel" : (mate ? " partner" : "")) +
      '" data-act="cell" data-i="' + i + '" aria-label="' + pos +
      (done ? "green" : "white") + ', ' + (digit || "empty") +
      (want && !done ? ", needs " + want : "") + (mate ? ", swap match" : "") +
      (cycleAt !== -1 ? ", cycle step " + (cycleAt + 1) : "") + '">' +
      (want && !done ? '<span class="corner tr">' + want + '</span>' : '') +
      (cycleAt !== -1 ? '<span class="cyclebadge">' + (cycleAt + 1) + '</span>' : '') +
      '<span class="big">' + digit + '</span></button>';
  }

  var sel = S.sel === i;
  var hasRed = !S.green[i] && S.reds[i] !== "";
  return '<button class="tile' + (S.green[i] ? " green" : "") +
    (S.yellow[i] && !S.green[i] ? " amber" : "") + (sel ? " sel" : "") +
    '" data-act="cell" data-i="' + i + '" aria-label="' + pos +
    (S.green[i] ? "green" : "white") + (S.vals[i] ? ", " + S.vals[i] : ", empty") +
    (hasRed ? ", red " + S.reds[i] : "") + (S.yellow[i] ? ", as-is" : "") + '">' +
    (hasRed && S.vals[i] ? '<span class="corner tl">' + S.vals[i] + '</span>' : '') +
    '<span class="big' + (hasRed ? " asred" : "") + '">' +
    (hasRed ? S.reds[i] : (S.vals[i] || "")) + '</span></button>';
}

function render() {
  var t = targets(), b = board(), ps = playStats(), i;
  var ls = inPlay() ? lineState() : { done: 0, flags: [] };
  var mates = inGuided() && S.pair.length === 1 ? partners(S.pair[0]) : [];
  var reciprocalLeft = inGuided() ? hasAnyReciprocal() : false;
  var cycle = inGuided() && S.pair.length === 1 && !reciprocalLeft && mates.length === 0
    ? findCycle(S.pair[0]) : [];
  mates.ls = ls;
  var left = pending();
  var h = '<div class="card">';

  h += '<div class="hdr"><h1>NUMBLE GRID</h1><div class="sub">' +
    (S.scanned ? "SCANNED GRID" : PUZZLE_ID) + '<br><span style="font-size:10px;letter-spacing:.12em">VERSION 2.1</span></div></div>';
  h += '<div class="rule"></div>';

  h += '<div class="pad">';
  if (inFree()) {
    h += '<button class="wide plain" data-act="edit">\u2190 Back to editing</button>';
    h += '<p class="hint">Swap any two loose tiles. A tile goes green once every line ' +
      'it sits in holds 1 to 7. Tiles the puzzle already had green are locked.</p>';
  } else if (inPlay()) {
    h += '<button class="wide plain" data-act="edit">\u2190 Back to editing</button>';
    h += '<p class="hint">Tap a square and any reciprocal swap is ringed in green. ' +
      'When no reciprocal swaps remain, tapping an unsolved square traces its full cycle in amber.</p>';
    if (ps.untargeted > 0) {
      h += '<p class="warn">' + ps.untargeted + (ps.untargeted === 1 ? ' square has' : ' squares have') +
        ' no target, so they can never turn green.</p>';
    }
  } else {
    h += '<button class="wide plain" style="margin-bottom:4px" data-act="scan">' +
      '\u2b06 Load from screenshot</button>';
    h += '<button class="wide ' + (inFix() ? "ink" : "off") + '" data-act="togglefix">' +
      '\u270e Fix grid ' + (inFix() ? "on" : "off") + '</button>';
    h += '<p class="hint">' + (inFix()
      ? "Tap any square, then type to correct the number the screenshot read."
      : "Tap a white square and type its red target. If you cannot work one out, mark it as-is.")
      + '</p>';
    if (S.msg) h += '<p class="' + (S.msg.bad ? "warn" : "good") + '">' + S.msg.text + '</p>';
  }
  h += '</div>';

  h += '<div class="grid7">';
  for (i = 0; i < N; i++) h += cellHTML(i, t, b, mates, cycle);
  h += '</div>';

  if (inGuided() && S.pair.length === 1 && !reciprocalLeft) {
    if (cycle.length) {
      h += '<div class="cyclepanel"><strong>Cycle found</strong>' +
        cycleDigits(cycle) + '<br><span class="muted">Follow the numbered amber tiles: ' +
        cycleLabel(cycle) + '. A ' + cycle.length + '-tile cycle takes ' + (cycle.length - 1) +
        ' swaps to resolve.</span></div>';
    } else {
      h += '<div class="cyclepanel"><strong>No reciprocal swaps remain</strong>' +
        'This tile is not part of a complete target cycle the coach can trace yet. Try another unsolved tile.</div>';
    }
  }

  if (inFree()) {
    var rowsDone = ls.flags.slice(0,4).filter(Boolean).length;
    var colsDone = ls.flags.slice(4).filter(Boolean).length;
    h += '<div class="status">' + rowsDone + '/4 rows \u00B7 ' + colsDone + '/4 columns \u00B7 ' +
      S.swaps + ' of 20 swaps</div>';
    if (ls.done === 8) {
      h += '<div class="banner">Solved in ' + S.swaps + (S.swaps === 1 ? ' swap' : ' swaps') + '</div>';
    }
    h += '<div class="lines">';
    h += '<button class="sbtn" data-act="undo"' + (!S.hist || !S.hist.length ? ' disabled aria-disabled="true"' : '') + '>\u21b6 Undo</button>';
    h += '<button class="sbtn" data-act="restart">Restart</button>';
    h += '</div>';
  } else if (inPlay()) {
    h += '<div class="status">' + ps.solved + ' of ' + ps.tiles + ' green \u00B7 ' +
      S.swaps + (S.swaps === 1 ? ' swap' : ' swaps') + '</div>';
    if (ps.complete) {
      h += '<div class="banner">Solved in ' + S.swaps + (S.swaps === 1 ? ' swap' : ' swaps') + '</div>';
    }
    h += '<div class="lines"><button class="sbtn" data-act="undo"' + (!S.hist || !S.hist.length ? ' disabled aria-disabled="true"' : '') + '>\u21b6 Undo</button>' +
      '<button class="sbtn" data-act="restart">Restart</button></div>';
  } else if (inFix()) {
    h += '<div class="status">Fix grid</div>';
  } else {
    var list = subsetOf("red"), done = 0;
    for (i = 0; i < list.length; i++) if (S.reds[list[i]] || S.yellow[list[i]]) done++;
    h += '<div class="status">Red targets \u00B7 ' + done + ' of ' + list.length + ' set</div>';
  }

  /* fix-mode panel for the selected square */
  if (inFix() && S.sel !== null) {
    if (isClue(S.sel)) {
      h += '<div class="ptrlabel">Pointers on this clue</div><div class="ptrrow">';
      POINTERS.forEach(function (p) {
        var on = S.dirs[S.sel][p.axis] === p.dir;
        h += '<button class="ptr' + (on ? " on" : "") + '" data-act="ptr" data-dir="' +
          p.dir + '" data-axis="' + p.axis + '" aria-label="Pointer ' + p.dir + '">' + p.glyph + '</button>';
      });
      h += '</div>';
    } else {
      h += '<div class="nextwrap"><button class="wide ' + (S.green[S.sel] ? "lime" : "plain") +
        '" data-act="togglegreen">' + (S.green[S.sel] ? "This square is green" : "Make this square green") +
        '</button></div>';
    }
  }

  if (!inPlay()) {
    h += '<div class="keypad">';
    ["1","2","3","4","5","6","7","8","9","0"].forEach(function (d) {
      h += '<button class="key' + (inFix() ? "" : " redtext") +
        '" data-act="digit" data-d="' + d + '">' + d + '</button>';
    });
    h += '<button class="key" data-act="back" aria-label="Delete">\u232B</button>';
    h += '<button class="key ink" data-act="advance" aria-label="Next cell">\u2192</button>';
    h += '</div>';
    if (!inFix()) {
      var isY = S.sel !== null && S.yellow[S.sel];
      h += '<div class="nextwrap"><button class="wide ' + (isY ? "amber" : "plain") +
        '" data-act="asis">' + (isY ? "Marked as-is - tap to undo" : "Mark as-is (cannot work it out)") +
        '</button></div>';
      h += '<div class="nextwrap"><button class="wide ink" data-act="free">' +
        '\u25B6 Play - just swap tiles</button></div>';
      h += '<div class="nextwrap"><button class="wide ' + (left ? "off" : "lime") + '" data-act="play">' +
        (left ? '\u25B6 Guided play - ' + left + ' target' + (left === 1 ? '' : 's') + ' to set'
              : '\u25B6 Guided play') + '</button></div>';
    }
  }

  h += '<div class="footer">';
  h += '<button class="sbtn" data-act="clearred"' + (inPlay() ? ' disabled style="opacity:.4"' : '') +
    '>Clear red</button>';
  h += '<button class="sbtn" data-act="reload">' + (S.scanned ? "Built-in" : "Reload " + PUZZLE_NO) + '</button>';
  h += '<button class="sbtn' + (S.armClear ? " armed" : "") + '" data-act="clear">' +
    (S.armClear ? "Tap again" : "Clear grid") + '</button>';
  h += '</div>';

  h += '</div>';
  document.getElementById("app").innerHTML = h;
}

function update() { save(); render(); }

/* ---------- events ---------- */

var armTimer = null;

document.getElementById("app").addEventListener("click", function (ev) {
  var el = ev.target.closest ? ev.target.closest("[data-act]") : null;
  if (!el) return;
  var act = el.getAttribute("data-act");
  if (act !== "clear" && S.armClear) S.armClear = false;
  if (act !== "scan") S.msg = null;

  if (act === "scan") { document.getElementById("shotfile").click(); return; }
  if (act === "cell") { tapCell(Number(el.getAttribute("data-i"))); return; }
  if (act === "digit") { pressDigit(el.getAttribute("data-d")); return; }
  if (act === "back") { backspace(); return; }
  if (act === "advance") { advance(); return; }
  if (act === "asis") { markAsIs(); return; }
  if (act === "ptr") { togglePointer(el.getAttribute("data-dir"), el.getAttribute("data-axis")); return; }
  if (act === "togglegreen") { toggleGreen(); return; }
  if (act === "togglefix") { setStep(inFix() ? "red" : "fix"); update(); return; }
  if (act === "play") { enterPlay(); return; }
  if (act === "free") { enterFree(); return; }
  if (act === "undo") { undoSwap(); return; }
  if (act === "edit") { S.pair = []; setStep("red"); update(); return; }
  if (act === "restart") { restartPlay(); return; }
  if (act === "clearred") { clearRed(); return; }
  if (act === "reload") { reloadPuzzle(); return; }
  if (act === "clear") {
    if (S.armClear) { clearAll(); return; }
    S.armClear = true; render();
    if (armTimer) clearTimeout(armTimer);
    armTimer = setTimeout(function () { S.armClear = false; render(); }, 4000);
    return;
  }
});

document.getElementById("shotfile").addEventListener("change", function (e) {
  readShot(e.target.files && e.target.files[0]);
  e.target.value = "";
});

["dragenter","dragover","dragleave","drop"].forEach(function (n) {
  window.addEventListener(n, function (e) { e.preventDefault(); });
});
window.addEventListener("drop", function (e) {
  if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length)
    readShot(e.dataTransfer.files[0]);
});
window.addEventListener("paste", function (e) {
  var it = e.clipboardData && e.clipboardData.items;
  if (!it) return;
  for (var i = 0; i < it.length; i++)
    if (it[i].type.indexOf("image") === 0) { readShot(it[i].getAsFile()); return; }
});

window.addEventListener("keydown", function (e) {
  if (inPlay()) return;
  if (/^[0-9]$/.test(e.key)) { e.preventDefault(); pressDigit(e.key); }
  else if (e.key === "Backspace") { e.preventDefault(); backspace(); }
  else if (e.key === "ArrowRight" || e.key === "Enter") { advance(); }
  else if (e.key === "ArrowLeft") {
    var p = prevIn(S.sel === null ? N : S.sel);
    if (p !== null) { S.sel = p; update(); }
  }
});

restore();
setStep(S.step === "play" ? "play" : S.step);
render();

})();
</script>
</body>
</html>
